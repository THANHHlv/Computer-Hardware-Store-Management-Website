# Render Blueprint – Computer Hardware Store
# https://render.com/docs/blueprint-spec

services:
  # ───────────────────────────────────────────
  # Backend: Spring Boot 3 (Docker)
  # ───────────────────────────────────────────
  - type: web
    name: pc-shop-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PORT
        value: "8080"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # VNPay Payment Gateway (Sandbox) — điền giá trị trên Render Dashboard
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false

  # ───────────────────────────────────────────
  # Frontend: React / Vite (Static Site)
  # ───────────────────────────────────────────
  - type: web
    name: pc-shop-frontend
    runtime: static
    buildCommand: "cd frontend && npm install --legacy-peer-deps && npm run build"
    staticPublishPath: frontend/dist
    branch: main
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
