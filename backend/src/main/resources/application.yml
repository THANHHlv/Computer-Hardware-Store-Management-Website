spring:
  application:
    name: computer-shop-backend

  # Database Configuration
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pc_shop_database_2}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: ComputerShopHikariPool
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:300000}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:20000}
      # Kiểm tra kết nối trước khi trả về:
      validation-timeout: 5000
      connection-test-query: SELECT 1

  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    time-zone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  servlet:
    multipart:
      max-file-size: ${APP_FILE_MAX_SIZE:20MB}
      max-request-size: ${APP_FILE_MAX_REQUEST_SIZE:25MB}

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always

# App Custom Configurations
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}

  file-storage:
    location: ${APP_FILE_STORAGE_LOCATION:uploads}

  inventory:
    default-low-stock-threshold: ${APP_DEFAULT_LOW_STOCK_THRESHOLD:10}

# Logging Configuration
logging:
  level:
    root: INFO
    com.computershop: ${LOGGING_LEVEL_COMPUTERSHOP:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_BINDER:ERROR}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} : %msg%n"

# VNPay Payment Gateway Configuration (Sandbox)
# Đăng ký tài khoản merchant sandbox tại: https://sandbox.vnpayment.vn
# KHÔNG hardcode giá trị thật — dùng biến môi trường trên Render/server
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/order/vnpay-return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
  version: "2.1.0"
  command: pay
  curr-code: VND
  locale: vn